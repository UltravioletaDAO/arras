[package]
name = "erc8004-payment-proof"
description = "Verificador de pruebas de feedback de ERC-8004 en NEAR para los pagos del escrow de Arras con disputa (contracts/escrow-v2): un escrow fijo en new; verify_feedback_proof(client, payment_id) devuelve la otra parte de un pago con plata liberada. Inmutable."
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
repository = "https://github.com/UltravioletaDAO/arras"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Build reproducible (NEP-330). El mismo bloque que contracts/erc8004-arras-verifier (cargo-near 0.22.0).
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.21.1-rust-1.96.0"
image_digest = "sha256:ccb22bb4e677ed022d8b9d1aa1b32f0af52dd0471ef1c32e48dedbf68ee6ee17"
passed_env = []
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
]

[dependencies]
near-sdk = "=5.29.1"
# `FeedbackProof` (la respuesta), `is_canonical_uint` y `parse_hash` (sin estado de contrato).
erc8004-common = { path = "../erc8004-common" }
# Solo `PaymentId` e `is_valid_operator_id` (sin estado de contrato: no exporta metodos a la wasm).
arras-escrow-core = { path = "../escrow-core" }

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }
# El `Payment` de verdad, solo en los tests: el espejo se prueba contra lo que serializa el escrow (no entra en la wasm).
arras-escrow-v2 = { path = "../escrow-v2" }
# `FungibleTokenReceiver`, para autorizar pagos en el escrow de verdad dentro del mock (`unit_tests/escrow.rs`); la misma
# version que usa el escrow (ya esta en el arbol).
near-contract-standards = "=5.29.1"
proptest = "=1.12.0"
# El sandbox (tests/workspaces.rs), con las mismas versiones que contracts/erc8004-reputation.
near-workspaces = { version = "=0.23.0", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"

[lints]
workspace = true
