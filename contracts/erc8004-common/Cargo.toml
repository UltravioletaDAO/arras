[package]
name = "erc8004-common"
description = "Port de ERC-8004 a NEAR: lo comun de los registros (validaciones, enteros canonicos, el resumen en 256 bits, eventos NEP-297 y los esquemas de las llamadas cruzadas). Sin estado de contrato."
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
repository = "https://github.com/UltravioletaDAO/arras"
license = "MIT"
publish = false

[dependencies]
near-sdk = "=5.29.1"

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }

[lints]
workspace = true
