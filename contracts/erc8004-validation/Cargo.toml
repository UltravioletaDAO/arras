[package]
name = "erc8004-validation"
description = "BORRADOR, NO DESPLEGABLE: ERC-8004 Validation Registry en NEAR. El equipo de ERC-8004 todavia no cerro esa seccion de la spec (8004.org/learn); se despliega en validation-registry.erc-8004.near cuando la cierre, previa revision."
version = "0.0.1"
edition = "2024"
rust-version = "1.93"
# El repo hoy es 0xultravioleta/arras y va a pasar a UltravioletaDAO/arras.
repository = "https://github.com/UltravioletaDAO/arras"
license = "MIT"
publish = false

# BORRADOR: a proposito SIN `[package.metadata.near.reproducible_build]`. `cargo near build reproducible-wasm` falla
# en este crate hasta que la seccion de Validation de ERC-8004 se cierre y alguien lo revise y lo agregue.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.29.1"
erc8004-common = { path = "../erc8004-common" }

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }

[lints]
workspace = true
