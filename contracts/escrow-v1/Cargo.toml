[package]
name = "arras-escrow-v1"
description = "Arras v1: escrow sin custodia de un solo token (USDC nativo de NEAR), inmutable y sin llaves"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
repository = "https://github.com/UltravioletaDAO/arras"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Build reproducible (NEP-330). Bloque copiado de `cargo near new` con cargo-near 0.22.0 (2026-11-01).
[package.metadata.near.reproducible_build]
# imagen docker del entorno de build; el tag es descriptivo, la imagen se identifica por el digest
image = "sourcescan/cargo-near:0.21.1-rust-1.96.0"
image_digest = "sha256:ccb22bb4e677ed022d8b9d1aa1b32f0af52dd0471ef1c32e48dedbf68ee6ee17"
passed_env = []
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
]

[dependencies]
near-sdk = "=5.29.1"
near-contract-standards = "=5.29.1"
arras-escrow-core = { path = "../escrow-core" }

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }
near-workspaces = "=0.23.0"
tokio = { version = "1", features = ["full"] }
proptest = "=1.12.0"
serde_json = "1"
anyhow = "1"

[lints]
workspace = true
