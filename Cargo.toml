[workspace]
resolver = "3"
# contracts/escrow-v2: H-9 (disputa, presupuesto de agente y ticket del operador); usa escrow-core sin tocarlo.
# contracts/test-ft: FT de prueba, solo para el sandbox de near-workspaces.
# contracts/registry-v1: identidad y reputacion de agentes (la forma de ERC-8004), atada a pagos liberados de Arras.
# contracts/test-escrow: escrow de mentira, solo para el sandbox del registro (respuestas de get_payment a medida).
# contracts/erc8004-*: el port fiel de ERC-8004 a NEAR (docs/plans/erc8004-near-port.md), en crates nuevos: common (sin
# estado), identity, reputation, arras-verifier y validation (BORRADOR, no se despliega todavia).
members = [
    "contracts/escrow-core",
    "contracts/escrow-v1",
    "contracts/escrow-v2",
    "contracts/test-ft",
    "contracts/registry-v1",
    "contracts/test-escrow",
    "contracts/erc8004-common",
    "contracts/erc8004-identity",
    "contracts/erc8004-reputation",
]

[workspace.lints.rust.unexpected_cfgs]
# `cfg(near)` existe desde near-sdk 5.27.0 (bloque copiado de `cargo near new`, cargo-near 0.22.0).
level = "warn"
check-cfg = ['cfg(near)']

# Los perfiles solo valen en la raiz del workspace (cargo ignora los de los miembros).
[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# Tests: las dependencias (el mock de near-sdk con near-vm-runner, near-workspaces) optimizadas; nuestras crates
# quedan en debug. Solo afecta `cargo test`/`cargo build` en dev: la wasm sale del perfil release de arriba.
[profile.dev.package."*"]
opt-level = 2
